experiment:
  mode: core
  host: simcot
  backbone: coconut
  use_lsp_jepa: true
  run_kind: pr14_mvp_min_eval

runtime:
  model_id: tiny
  device: auto
  seed: 0

data:
  eval_json: /root/autodl-tmp/lsp_jepa/data/gsm8k_train.jsonl
  eval_split: test
  dataset_id: openai/gsm8k
  dataset_config: main
  hf_endpoint: https://hf-mirror.com
  expected_samples: 1319

eval:
  script: lsp_jepa/scripts/eval_lsp_jepa_core.py
  checkpoint_path: /root/autodl-tmp/lsp_jepa/runs/pr13_mvp_full_seq_launch/max_steps_100/checkpoints/step_000100.pt
  output_dir: /root/autodl-tmp/lsp_jepa/runs/pr14_mvp_min_eval
  metrics_path: /root/autodl-tmp/lsp_jepa/runs/pr14_mvp_min_eval/metrics.json
  limit_eval_samples: 20
  max_new_tokens: 32
  save_examples: 5
  generate_cot: false
  final_answer_only: true

student:
  latent_arch: latent_tokens
  num_latent_steps: 4
  latent_dim: null
  normalize_latents: true
  detach_between_steps: false

teacher:
  used_for_eval: false
  ema_update_during_eval: false

metrics:
  output_file: metrics.json
  include_accuracy: true
  include_exact_match: true
  include_generated_length: true
  include_invalid_answer_rate: true
  answer_normalization: coconut_baseline_split_hash_remove_commas_strip

eval_contract:
  no_cot_generation: true
  no_step_level_eval: true
  no_adapter_expansion: true
  no_teacher_branch_dependency: true
  no_ema_update: true
